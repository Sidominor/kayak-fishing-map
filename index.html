<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kayak Fishing Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f6f6;--fg:#0f2229;--card:#fff;--ac:#0a7c78;--hi:#e8541a;--mut:#58707a;--bd:#d5e1e3}
@media(prefers-color-scheme:dark){:root{--bg:#0b181d;--fg:#e4eef0;--card:#142529;--ac:#3cc7bb;--hi:#ff7a3d;--mut:#8fa8b0;--bd:#25393f}}
*{box-sizing:border-box}
html,body{height:100%;min-height:560px;margin:0}
body{height:100vh;height:100dvh;font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);-webkit-tap-highlight-color:transparent}
button{min-height:44px;min-width:44px;font:700 16px Barlow,sans-serif;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0;font-weight:700}
#wx{font-size:13px;color:var(--mut);line-height:1.25;flex:1;text-align:right}
#un{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 10px;font-size:13px}
main{flex:1;position:relative;min-height:380px}
#map{position:absolute;inset:0;background:#a9c7d3;touch-action:none}
#log{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--bg);display:none}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mut);min-height:52px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
#fabs{position:absolute;z-index:500;left:10px;right:10px;bottom:62px;display:flex;gap:8px}
.fab{border:0;border-radius:26px;padding:0 18px;min-height:52px;background:var(--ac);color:#fff;box-shadow:0 2px 8px #0005}
.fab.l{background:var(--hi)}.fab.g{background:var(--card);color:var(--fg);margin-left:auto;min-width:52px;padding:0}
#cross{position:absolute;z-index:450;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:var(--hi);box-shadow:0 0 0 1px #fff}
#cross:before{left:21px;top:0;width:2px;height:44px}#cross:after{top:21px;left:0;height:2px;width:44px}
#bar{position:absolute;z-index:600;left:10px;right:10px;bottom:62px;background:var(--card);border:2px solid var(--hi);border-radius:14px;padding:10px;display:none}
#bar p{margin:0 0 8px;font-weight:600}
#bar div{display:flex;gap:8px}#bar button{flex:1}
#warn{position:absolute;z-index:700;left:10px;right:10px;top:10px;background:var(--hi);color:#fff;padding:10px 12px;border-radius:10px;font-weight:600;display:none}
input,select,textarea{width:100%;min-height:46px;padding:10px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:16px Barlow,sans-serif}
label{font-size:13px;color:var(--mut);font-weight:600}
.btn{border:0;border-radius:10px;padding:0 16px;background:var(--ac);color:#fff}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.row small{color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--fg);width:min(92vw,380px);padding:16px}
dialog::backdrop{background:#0008}
.pin{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px #0006)}
.leaflet-popup-content{font-family:Barlow,sans-serif;margin:12px 14px}
.leaflet-popup-content button{margin:8px 6px 0 0;padding:0 12px;font-size:15px}
.leaflet-bar a{width:44px!important;height:44px!important;line-height:44px!important;font-size:20px}
.leaflet-control-layers-toggle{width:44px!important;height:44px!important}
.leaflet-control-layers label{font-size:15px;color:#123;padding:6px 0}
</style>
</head>
<body>
<header><h1>Kayak Fishing Map</h1><div id="wx">Loading conditions…</div><button id="un"></button></header>
<main>
  <div id="map"></div>
  <div id="cross"></div>
  <div id="warn"></div>
  <div id="fabs"><button class="fab" id="addS">＋ Spot</button><button class="fab l" id="addL">＋ Launch</button><button class="fab g" id="loc" aria-label="My location">◎</button></div>
  <div id="bar"><p id="barT"></p><div><button class="btn alt" id="bc">Cancel</button><button class="btn" id="bo">Place here</button></div></div>
  <section id="log">
    <h2 style="margin:0 0 6px">Log a catch</h2>
    <label>Species</label><input id="cs" placeholder="Redfish, bass, trout…">
    <label>Length (inches)</label><input id="cl" type="number" inputmode="decimal">
    <label>Spot</label><select id="csp"></select>
    <label>Notes (bait, tide, water temp)</label><textarea id="cn" rows="2"></textarea>
    <button class="btn" id="csave" style="width:100%">Save catch</button>
    <h2 style="margin:22px 0 0">Your catches</h2><div id="clist"></div>
    <h2 style="margin:22px 0 0">Your spots</h2><div id="slist"></div>
    <h2 style="margin:22px 0 4px">Backup</h2>
    <p style="margin:0 0 8px;color:var(--mut);font-size:14px">Your data is saved on this device only. Export a backup now and then, especially before clearing browser data.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exp">Backup / Export JSON</button><button class="btn alt" id="imp">Restore from file</button></div>
    <input type="file" id="impf" accept="application/json,.json" style="display:none">
    <div style="height:30px"></div>
  </section>
</main>
<nav><button id="t1" class="on">Map</button><button id="t2">Catches</button></nav>

<dialog id="dlg">
  <h3 style="margin:0 0 8px">New spot</h3>
  <label>Name</label><input id="sn" placeholder="Mangrove point">
  <label>Type</label><select id="st"><option value="fish">Fishing spot</option><option value="launch">Launch (put-in)</option></select>
  <label>Notes</label><textarea id="sno" rows="2"></textarea>
  <div style="display:flex;gap:8px"><button class="btn alt" id="sx" style="flex:1">Cancel</button><button class="btn" id="so" style="flex:1">Save</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
if(typeof L==='undefined'){$('warn').textContent='The map library could not load. Check your internet connection.';$('warn').style.display='block';throw new Error('Leaflet blocked')}
const KEY='kfm1';
let S={spots:[],catches:[],units:'us'},store=true;
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){store=false}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){store=false;note('Storage is blocked (private mode?). Use Backup to keep your data.')}};
function note(t,ms){const w=$('warn');w.textContent=t;w.style.display='block';if(ms)setTimeout(()=>w.style.display='none',ms)}
if(!store)note('Storage is blocked (private mode?). Use Backup to keep your data.');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hav=(a,b)=>{const R=3958.8,r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const marine=()=>S.units==='marine';
const dist=mi=>marine()?(mi/1.15078).toFixed(1)+' nm':mi.toFixed(1)+' mi';

const map=L.map('map',{zoomControl:false}).setView([27.95,-82.46],10);
L.control.zoom({position:'topright'}).addTo(map);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const noaa=L.tileLayer.wms('https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/ENCOnline/MapServer/exts/MaritimeChartService/WMSServer',{layers:'0',version:'1.3.0',format:'image/png',transparent:true,opacity:.9,attribution:'NOAA ENC (not for navigation)'}).addTo(map);
const sea=L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenSeaMap'});
L.control.layers({'Street map':osm},{'NOAA charts (US depths)':noaa,'Sea marks':sea},{position:'topleft'}).addTo(map);
let ne=0;noaa.on('tileerror',()=>{if(++ne===6)note('NOAA chart layer is not responding. NOAA updates charts on Fridays, so try again later.',9000)});
noaa.on('tileload',()=>{ne=0});
osm.on('tileerror',()=>{if(++ne===6)note('The map can’t load. Check your internet connection.',9000)});
const group=L.layerGroup().addTo(map);
let me=null;

function draw(){
  group.clearLayers();
  S.spots.forEach(s=>{
    const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="pin">'+(s.type==='launch'?'🚩':'🎣')+'</div>',iconSize:[30,30],iconAnchor:[15,26]})}).addTo(group);
    let d='';
    if(s.type!=='launch'){const l=S.spots.filter(x=>x.type==='launch');if(l.length){const n=Math.min(...l.map(x=>hav([s.lat,s.lng],[x.lat,x.lng])));d='<br>Round trip from nearest launch: about '+dist(n*2)+' (straight line)'}}
    m.bindPopup('<b>'+esc(s.name)+'</b><br>'+(s.type==='launch'?'Launch':'Fishing spot')+(s.note?'<br>'+esc(s.note):'')+d+'<br><button class="btn" onclick="logAt(\''+s.id+'\')">Log catch</button><button class="btn alt" onclick="delSpot(\''+s.id+'\')">Delete</button>');
  });
  $('csp').innerHTML='<option value="">No spot</option>'+S.spots.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');
  $('slist').innerHTML=S.spots.length?S.spots.map(s=>'<div class="row"><div><b>'+esc(s.name)+'</b><br><small>'+(s.type==='launch'?'Launch':'Fishing spot')+'</small></div><button class="btn alt" onclick="goTo(\''+s.id+'\')">Show</button></div>').join(''):'<p style="color:var(--mut)">No spots yet. Use “＋ Spot” or “＋ Launch” on the map.</p>';
  $('clist').innerHTML=S.catches.length?[...S.catches].reverse().map(c=>{const sp=S.spots.find(s=>s.id===c.spot);return '<div class="row"><div><b>'+esc(c.species||'Fish')+(c.len?' · '+esc(c.len)+' in':'')+'</b><br><small>'+new Date(c.t).toLocaleDateString()+(sp?' · '+esc(sp.name):'')+(c.note?' · '+esc(c.note):'')+'</small></div><button class="btn alt" aria-label="Delete catch" onclick="delCatch(\''+c.id+'\')">✕</button></div>'}).join(''):'<p style="color:var(--mut)">No catches yet. Log your first one above.</p>';
  $('un').textContent=marine()?'Marine: nm · kn':'US: mi · mph';
}
window.delSpot=id=>{if(confirm('Delete this spot?')){S.spots=S.spots.filter(s=>s.id!==id);save();draw()}};
window.delCatch=id=>{if(confirm('Delete this catch?')){S.catches=S.catches.filter(c=>c.id!==id);save();draw()}};
window.goTo=id=>{const s=S.spots.find(x=>x.id===id);tab(1);map.setView([s.lat,s.lng],15)};
window.logAt=id=>{map.closePopup();tab(2);$('csp').value=id;$('cs').focus()};

function tab(n){const m=n===1;$('map').style.display=m?'block':'none';$('fabs').style.display=m&&!placing?'flex':'none';$('log').style.display=m?'none':'block';$('t1').className=m?'on':'';$('t2').className=m?'':'on';if(m)setTimeout(()=>map.invalidateSize(),50)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* Placing spots: crosshair mode (buttons) or long-press mode, always with confirmation */
let placing=null,temp=null;
function begin(type,ll){
  placing={type,ll:ll||null};$('fabs').style.display='none';map.closePopup();
  if(ll){temp=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="pin">📍</div>',iconSize:[30,30],iconAnchor:[15,26]})}).addTo(map);$('barT').textContent='Add a spot at this pin?'}
  else{$('cross').style.display='block';$('barT').textContent='Move the map so the cross is on the '+(type==='launch'?'launch':'spot')+', then confirm.'}
  $('bar').style.display='block';
}
function endPlace(){placing=null;if(temp){map.removeLayer(temp);temp=null}$('cross').style.display='none';$('bar').style.display='none';if($('log').style.display!=='block')$('fabs').style.display='flex'}
let pend=null;
$('addS').onclick=()=>begin('fish');$('addL').onclick=()=>begin('launch');
$('bc').onclick=endPlace;
$('bo').onclick=()=>{pend=placing.ll||map.getCenter();const t=placing.type;endPlace();$('sn').value='';$('sno').value='';$('st').value=t;$('dlg').showModal()};
$('sx').onclick=()=>$('dlg').close();
$('so').onclick=()=>{S.spots.push({id:'s'+Date.now(),name:$('sn').value.trim()||'Unnamed spot',type:$('st').value,note:$('sno').value.trim(),lat:pend.lat,lng:pend.lng});save();draw();$('dlg').close()};
let lp=null,lx=0,ly=0;const mc=map.getContainer();
mc.addEventListener('pointerdown',e=>{if(lp){clearTimeout(lp);lp=null;return}if(placing||e.target.closest('.leaflet-control,.leaflet-popup,.leaflet-marker-icon'))return;lx=e.clientX;ly=e.clientY;lp=setTimeout(()=>{lp=null;if(navigator.vibrate)navigator.vibrate(30);begin('fish',map.mouseEventToLatLng(e))},700)});
mc.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lx,e.clientY-ly)>10){clearTimeout(lp);lp=null}});
['pointerup','pointercancel','pointerleave'].forEach(k=>mc.addEventListener(k,()=>{clearTimeout(lp);lp=null}));

$('csave').onclick=()=>{if(!$('cs').value.trim()&&!$('cl').value)return;S.catches.push({id:'c'+Date.now(),t:Date.now(),species:$('cs').value.trim(),len:$('cl').value,spot:$('csp').value,note:$('cn').value.trim()});$('cs').value=$('cl').value=$('cn').value='';save();draw()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='kayak-fishing-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.spots)||!Array.isArray(j.catches))throw 0;if(confirm('Replace your current data with this backup?')){S={spots:j.spots,catches:j.catches,units:j.units==='marine'?'marine':'us'};save();draw();wx()}}catch(x){alert('This file is not a valid backup.')}};r.readAsText(f);e.target.value=''};
$('un').onclick=()=>{S.units=marine()?'us':'marine';save();draw();wx()};

$('loc').onclick=()=>{
  if(!navigator.geolocation){alert('Location is not available on this device.');return}
  navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(me)me.setLatLng(ll);else me=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#2a7fff',fillOpacity:1}).addTo(map);map.setView(ll,14)},()=>alert('Could not get your location. Allow location access in your browser settings.'),{enableHighAccuracy:true,timeout:10000});
};

const dir=d=>['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
let wt;
async function wx(){
  const c=map.getCenter(),q='latitude='+c.lat.toFixed(3)+'&longitude='+c.lng.toFixed(3),wu=marine()?'kn':'mph';
  try{
    const j=(await(await fetch('https://api.open-meteo.com/v1/forecast?'+q+'&current=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit='+wu)).json()).current;
    let w='';
    try{const m=await(await fetch('https://marine-api.open-meteo.com/v1/marine?'+q+'&current=wave_height&length_unit=imperial')).json();if(m.current&&m.current.wave_height!=null)w=' · waves '+m.current.wave_height.toFixed(1)+' ft'}catch(e){}
    const warn=j.wind_gusts_10m>=(marine()?17:20)?' ⚠ Gusty':'';
    $('wx').innerHTML='<b>'+Math.round(j.temperature_2m)+'°F</b> · wind '+dir(j.wind_direction_10m)+' '+Math.round(j.wind_speed_10m)+' '+wu+'<br>gusts '+Math.round(j.wind_gusts_10m)+' '+wu+w+warn;
  }catch(e){$('wx').textContent='Conditions unavailable (offline?)'}
}
map.on('moveend',()=>{clearTimeout(wt);wt=setTimeout(wx,700)});
draw();wx();
</script>
</body>
</html>
